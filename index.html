```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Docker Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            width: 500px;
            padding: 50px;
            border-radius: 20px;
            text-align: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        button {
            background: #667eea;
            color: white;
            border: none;

            padding: 14px 30px;
            font-size: 16px;

            border-radius: 10px;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        #message {
            margin-top: 25px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Hello Docker! 🐳</h1>

        <p>
            This is my first static website running inside a Docker container.
        </p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>

    </div>


    <script>
        function showMessage() {

            document.getElementById("message").innerText =
                "🎉 Website is running successfully!";
        }
    </script>

</body>
</html>
```
